name: Build desktop installers

# Manual trigger only — installers only need rebuilding when there's
# actually a new version to hand someone, not on every push. Trigger it from
# the Actions tab when you need a fresh build, picking which platform(s) —
# no need to rebuild an unchanged Mac binary for a Windows-only fix, say.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - windows
          - macos

jobs:
  # The matrix context isn't available in a job-level `if:` (it's only
  # resolved per-instance once a job actually starts), so filtering matrix
  # entries by the platform input has to happen before the build job's
  # matrix is even expanded — otherwise the deselected platform's runner
  # would still spin up just to immediately skip everything, which defeats
  # the whole point of choosing "windows" over "both". This job computes
  # which matrix entries to include and hands them to `build` as JSON.
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          WINDOWS='{"os_key":"windows","platform":"windows-latest","rust-targets":"","build-args":""}'
          MACOS='{"os_key":"macos","platform":"macos-latest","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin","build-args":"--target universal-apple-darwin"}'
          case "${{ github.event.inputs.platform }}" in
            windows) INCLUDE="[$WINDOWS]" ;;
            macos) INCLUDE="[$MACOS]" ;;
            *) INCLUDE="[$WINDOWS,$MACOS]" ;;
          esac
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"

  build:
    needs: compute-matrix
    strategy:
      fail-fast: false
      # Universal Mac binary (Intel + Apple Silicon in one build) since we
      # don't know which Mac it'll end up running on — costs roughly 2x a
      # single-arch build, so switch to just aarch64-apple-darwin or
      # x86_64-apple-darwin in compute-matrix above if that's ever pinned
      # down.
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Caches Cargo registry/build output between runs — without this,
      # every manual trigger recompiles every Rust dependency from scratch,
      # which is exactly the kind of thing that eats macOS minutes fastest.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.build-args }}

      # No code-signing certificate is configured, so these installers are
      # unsigned — Windows SmartScreen and macOS Gatekeeper will both flag
      # them as coming from an unrecognized publisher on first launch. See
      # the README for the workaround each OS needs.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
