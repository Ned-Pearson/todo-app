name: Build desktop installers

# Manual trigger only — this repo is private, and macOS runners burn through
# GitHub's free Actions minutes at 10x the rate of Windows/Linux ones, so
# this shouldn't run on every push. Trigger it from the Actions tab when you
# actually need a fresh build to hand to someone.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-targets: ""
            build-args: ""
          # Universal binary (Intel + Apple Silicon in one build) since we
          # don't know which Mac it'll end up running on — costs roughly 2x
          # a single-arch build, so switch to just aarch64-apple-darwin or
          # x86_64-apple-darwin here if that's ever pinned down.
          - platform: macos-latest
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            build-args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Caches Cargo registry/build output between runs — without this,
      # every manual trigger recompiles every Rust dependency from scratch,
      # which is exactly the kind of thing that eats macOS minutes fastest.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.build-args }}

      # No code-signing certificate is configured, so these installers are
      # unsigned — Windows SmartScreen and macOS Gatekeeper will both flag
      # them as coming from an unrecognized publisher on first launch. See
      # the README for the workaround each OS needs.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
