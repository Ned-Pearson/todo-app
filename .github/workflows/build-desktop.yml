name: Build desktop installers

# Manual trigger only — installers only need rebuilding when there's
# actually a new version to hand someone, not on every push. Trigger it from
# the Actions tab when you need a fresh build, picking which platform(s) —
# no need to rebuild an unchanged Mac binary for a Windows-only fix, say.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - windows
          - macos

# The GITHUB_TOKEN otherwise defaults to read-only — bump-version needs to
# push a commit.
permissions:
  contents: write

jobs:
  # Windows' installer upgrade behavior (MSI in particular) is keyed off the
  # version number actually changing between builds — without this, running
  # the workflow twice in a row produces two installers that both claim to
  # be "0.1.0" or whatever, and Windows has no reliable way to tell a
  # newer install from a same-version reinstall. Bumping the patch version
  # here, once per trigger, means that problem can't come up by forgetting —
  # there's nothing to remember.
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$NEW_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "
          # Only the [package] version — dependency versions elsewhere in
          # this file (e.g. `tauri = { version = "2", ... }`) never start a
          # line with `version = `, so the first match is always the right
          # one.
          sed -i "0,/^version = \".*\"/s//version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

      # Cargo.lock's own record of this package's version will drift one
      # version behind until someone next runs `cargo build` locally and
      # commits the refresh — harmless (it's not a dependency-resolution
      # conflict, just a cosmetic mismatch), and not worth installing a
      # Rust toolchain in this job just to keep it in lockstep.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}"
          git push

  # The matrix context isn't available in a job-level `if:` (it's only
  # resolved per-instance once a job actually starts), so filtering matrix
  # entries by the platform input has to happen before the build job's
  # matrix is even expanded — otherwise the deselected platform's runner
  # would still spin up just to immediately skip everything, which defeats
  # the whole point of choosing "windows" over "both". This job computes
  # which matrix entries to include and hands them to `build` as JSON.
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          WINDOWS='{"os_key":"windows","platform":"windows-latest","rust-targets":"","build-args":""}'
          MACOS='{"os_key":"macos","platform":"macos-latest","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin","build-args":"--target universal-apple-darwin"}'
          case "${{ github.event.inputs.platform }}" in
            windows) INCLUDE="[$WINDOWS]" ;;
            macos) INCLUDE="[$MACOS]" ;;
            *) INCLUDE="[$WINDOWS,$MACOS]" ;;
          esac
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"

  build:
    needs: [bump-version, compute-matrix]
    strategy:
      fail-fast: false
      # Universal Mac binary (Intel + Apple Silicon in one build) since we
      # don't know which Mac it'll end up running on — costs roughly 2x a
      # single-arch build, so switch to just aarch64-apple-darwin or
      # x86_64-apple-darwin in compute-matrix above if that's ever pinned
      # down.
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      # Explicit ref rather than the default (which resolves to the SHA at
      # dispatch time) — bump-version already pushed a new commit onto this
      # branch by the time this job starts, and without this the build
      # would silently use the pre-bump version instead.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Caches Cargo registry/build output between runs — without this,
      # every manual trigger recompiles every Rust dependency from scratch,
      # which is exactly the kind of thing that eats macOS minutes fastest.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      # No code-signing certificate is configured, so these installers are
      # unsigned — Windows SmartScreen and macOS Gatekeeper will both flag
      # them as coming from an unrecognized publisher on first launch. See
      # the README for the workaround each OS needs. (Separate from the
      # updater's own signing key below, which only proves an update
      # actually came from this repo — it doesn't satisfy either OS's own
      # code-signing check.)
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts below so the plugin can verify them
          # against tauri.conf.json's pubkey at update time. Generated via
          # `tauri signer generate --ci` with no password (see README), so
          # the _PASSWORD secret is left unset — a missing secret resolves
          # to an empty string, which the signer reads as "no password"
          # rather than erroring.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Same tag on both matrix legs: tauri-action finds the release
          # a first-finishing platform already created for this tag and
          # appends its own assets instead of creating a second release,
          # which is how one release ends up with both installers.
          tagName: v${{ needs.bump-version.outputs.version }}
          releaseName: "todo-app v${{ needs.bump-version.outputs.version }}"
          releaseBody: "See the assets below to download this version."
          # Draft, not published: GitHub's "latest release" (what the
          # updater endpoint resolves against) skips drafts, so this is a
          # chance to sanity-check both platforms' installers before
          # anyone's app offers this as an update. Publish it manually
          # from the repo's Releases page once you're happy with it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.build-args }}
